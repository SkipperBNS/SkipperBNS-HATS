name: Build HATS Pack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build HATS Pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HATS pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "main"
          }

          Write-Host "Version: $version"

          if (-not (Test-Path ".\scripts\build.ps1")) {
            throw "scripts\build.ps1 was not found."
          }

          if (-not (Test-Path ".\components.json")) {
            throw "components.json was not found."
          }

          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path ".\dist" `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Running build.ps1..."
          Write-Host ""

          & ".\scripts\build.ps1" -Version $version

          if ($LASTEXITCODE -ne 0) {
            throw "build.ps1 failed with exit code $LASTEXITCODE"
          }

          $zipFiles = @(
            Get-ChildItem `
              -Path "." `
              -Filter "*.zip" `
              -File `
              -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*"
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP was produced."
          }

          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          $destination = Join-Path ".\dist" $zip.Name

          Copy-Item `
            -LiteralPath $zip.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Failed to copy ZIP to dist."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BUILD SUCCESSFUL"
          Write-Host "=========================================="
          Write-Host "Output: $destination"

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipFiles = @(
            Get-ChildItem ".\dist\*.zip" -File
          )

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP files found."
          }

          $lines = foreach ($file in $zipFiles) {
            $hash = (
              Get-FileHash `
                -Path $file.FullName `
                -Algorithm SHA256
            ).Hash

            "$hash  $($file.Name)"
          }

          $lines |
            Out-File `
              ".\dist\SHA256SUMS.txt" `
              -Encoding utf8

          Write-Host ""
          Get-Content ".\dist\SHA256SUMS.txt"

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipFiles = @(
            Get-ChildItem ".\dist\*.zip" -File
          )

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP exists in dist."
          }

          if (-not (Test-Path ".\dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt does not exist."
          }

          foreach ($file in $zipFiles) {
            Write-Host "ZIP: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"

            if ($file.Length -le 0) {
              throw "ZIP is empty."
            }
          }

          Write-Host ""
          Write-Host "BUILD VERIFIED SUCCESSFULLY."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkipperBNS HATS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
