name: Build SkipperBNS HATS Pack

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: hats-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SkipperBNS HATS
    runs-on: windows-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # VERIFY LOCAL FILES
      # ==================================================

      - name: Verify local applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Checking local applications"
          Write-Host "=========================================="
          Write-Host ""

          $files = @(
            ".\ftpd.nro",
            ".\checkpoint.nro"
          )

          foreach ($path in $files) {

            if (-not (Test-Path $path)) {
              throw "Required local file was not found: $path"
            }

            $file = Get-Item $path

            if ($file.Length -le 0) {
              throw "Local file is empty: $path"
            }

            Write-Host "Found:"
            Write-Host "  $path"
            Write-Host "  Size: $($file.Length) bytes"
            Write-Host ""
          }

          Write-Host "Local applications verified."

      # ==================================================
      # BUILD
      # ==================================================

      - name: Build HATS pack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="
          Write-Host ""

          if (-not (Test-Path ".\scripts\build.ps1")) {
            throw "scripts/build.ps1 was not found."
          }

          if (-not (Test-Path ".\components.json")) {
            throw "components.json was not found."
          }

          Write-Host "GitHub token configured:"
          Write-Host (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN))
          Write-Host ""

          if ("${{ github.ref_type }}" -eq "tag") {

            $version = "${{ github.ref_name }}"

            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }
          else {
            $version = "main"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "main"
          }

          Write-Host "Build version: $version"
          Write-Host ""

          Write-Host "Running build.ps1..."
          Write-Host ""

          & ".\scripts\build.ps1" -Version $version

          if ($LASTEXITCODE -ne 0) {
            throw "build.ps1 failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " build.ps1 completed successfully"
          Write-Host "=========================================="

      # ==================================================
      # PREPARE DIST
      # ==================================================

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Preparing release files"
          Write-Host "=========================================="
          Write-Host ""

          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path ".\dist" `
            -Force | Out-Null

          $zipFiles = @(
            Get-ChildItem "." -Filter "*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*" -and
              $_.FullName -notlike "*\work\*" -and
              $_.Length -gt 0
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "No HATS ZIP was produced by build.ps1."
          }

          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host "HATS ZIP found:"
          Write-Host $zip.FullName
          Write-Host "Size: $($zip.Length) bytes"
          Write-Host ""

          $destination = Join-Path ".\dist" $zip.Name

          Copy-Item `
            -LiteralPath $zip.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Failed to copy HATS ZIP into dist."
          }

          $copied = Get-Item $destination

          if ($copied.Length -le 0) {
            throw "Copied HATS ZIP is empty."
          }

          Write-Host "Release ZIP:"
          Write-Host $copied.FullName
          Write-Host "Size: $($copied.Length) bytes"

      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Generating SHA256 checksum"
          Write-Host "=========================================="
          Write-Host ""

          $zipFiles = @(
            Get-ChildItem ".\dist\*.zip" -File
          )

          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one ZIP in dist."
          }

          $lines = foreach ($file in $zipFiles) {

            $hash = (
              Get-FileHash `
                $file.FullName `
                -Algorithm SHA256
            ).Hash

            "$hash  $($file.Name)"
          }

          $lines | Out-File `
            ".\dist\SHA256SUMS.txt" `
            -Encoding utf8

          Write-Host "SHA256SUMS.txt:"
          Write-Host ""

          Get-Content ".\dist\SHA256SUMS.txt"

      # ==================================================
      # VERIFY
      # ==================================================

      - name: Verify release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Verifying release"
          Write-Host "=========================================="
          Write-Host ""

          $zipFiles = @(
            Get-ChildItem ".\dist\*.zip" -File
          )

          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one HATS ZIP, found $($zipFiles.Count)."
          }

          $zip = $zipFiles[0]

          if ($zip.Length -le 0) {
            throw "HATS ZIP is empty."
          }

          Write-Host "ZIP:"
          Write-Host "  $($zip.Name)"
          Write-Host "  $($zip.Length) bytes"
          Write-Host ""

          if (-not (Test-Path ".\dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt was not created."
          }

          $checksum = Get-Item ".\dist\SHA256SUMS.txt"

          if ($checksum.Length -le 0) {
            throw "SHA256SUMS.txt is empty."
          }

          Write-Host "SHA256SUMS.txt:"
          Get-Content ".\dist\SHA256SUMS.txt"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BUILD VERIFIED SUCCESSFULLY"
          Write-Host "=========================================="

      # ==================================================
      # UPLOAD WORKFLOW ARTIFACT
      # ==================================================

      - name: Upload HATS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SkipperBNS-HATS-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # ==================================================
      # PUBLISH RELEASE
      # ==================================================

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"

          $zipFiles = @(
            Get-ChildItem ".\dist\*.zip" -File
          )

          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one HATS ZIP."
          }

          $zip = $zipFiles[0]

          $checksum = Get-Item ".\dist\SHA256SUMS.txt"

          Write-Host "=========================================="
          Write-Host " Publishing GitHub Release"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Tag:"
          Write-Host $tag
          Write-Host ""

          # Check whether release already exists.
          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Release already exists."
            Write-Host "Replacing release assets..."

            gh release upload `
              $tag `
              $zip.FullName `
              $checksum.FullName `
              --clobber

          }
          else {

            Write-Host "Creating new release..."

            gh release create `
              $tag `
              $zip.FullName `
              $checksum.FullName `
              --title "SkipperBNS HATS $tag" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release operation failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RELEASE PUBLISHED SUCCESSFULLY"
          Write-Host "=========================================="
