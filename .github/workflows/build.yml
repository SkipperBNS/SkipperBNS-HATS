name: Build HATS Pack

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        shell: pwsh
        run: |
          Write-Host "Preparing dist folder..."

          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Path ".\dist" -Force | Out-Null

          Write-Host "dist folder ready."

      - name: Build HATS pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host " Version: $version"
          Write-Host "=========================================="

          if (-not (Test-Path ".\scripts\build.ps1")) {
            throw "scripts\build.ps1 was not found"
          }

          if (-not (Test-Path ".\components.json")) {
            throw "components.json was not found"
          }

          & .\scripts\build.ps1 -Version $version

          if ($LASTEXITCODE -ne 0) {
            throw "build.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Build output"
          Write-Host "=========================================="

          if (-not (Test-Path ".\dist")) {
            throw "dist folder was not created"
          }

          $zipFiles = @(Get-ChildItem ".\dist" -Filter "*.zip" -File)

          if ($zipFiles.Count -eq 0) {
            Write-Host "No ZIP files found in dist."
            Write-Host ""
            Write-Host "Contents of dist:"
            Get-ChildItem ".\dist" -Force | Format-Table Name, Length
            throw "build.ps1 did not produce a ZIP package"
          }

          Write-Host ""
          Write-Host "ZIP packages found:"
          $zipFiles | ForEach-Object {
            Write-Host " - $($_.Name)"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $zipFiles = @(Get-ChildItem ".\dist" -Filter "*.zip" -File)

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP files available for checksum generation"
          }

          $lines = foreach ($file in $zipFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }

          $lines | Out-File ".\dist\SHA256SUMS.txt" -Encoding utf8

          Write-Host "SHA256SUMS.txt created."

      - name: Show final files
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Final build files"
          Write-Host "=========================================="

          Get-ChildItem ".\dist" -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkipperBNS HATS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
