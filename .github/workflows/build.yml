name: Build HATS Pack

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Build HATS pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          .\scripts\build.ps1 -Version $version

name: Checkout
uses: actions/checkout@v4
name: Build HATS pack
shell: pwsh
run: |
  $version = "${{ github.ref_name }}"
  if ($version.StartsWith("v")) {
 $version = $version.Substring(1)
  }
  .\scripts\build.ps1 -Version $version
name: Generate checksums
shell: pwsh
run: |
  New-Item -ItemType Directory -Force -Path .\dist | Out-Null
  $zipFiles = Get-ChildItem .\dist*.zip -File
  if (-not $zipFiles) {
 throw "No ZIP files found in .\dist"
  }
  $checksums = $zipFiles | ForEach-Object {
 $hash = Get-FileHash -LiteralPath $.FullName -Algorithm SHA256
"$($hash.Hash)  $($.Name)"
  }
  $checksums | Out-File .\dist\SHA256SUMS.txt -Encoding utf8
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
