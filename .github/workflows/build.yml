name: Build HATS Pack

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # BUILD HATS PACK
      # ==========================================
      - name: Build HATS pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          # For tag builds, remove the leading "v"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="
          Write-Host "Version: $version"
          Write-Host ""

          .\scripts\build.ps1 -Version $version

      # ==========================================
      # VERIFY BUILD OUTPUT
      # ==========================================
      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Build output"
          Write-Host "=========================================="

          if (-not (Test-Path ".\dist")) {
            throw "dist folder was not created by build.ps1"
          }

          $zipFiles = Get-ChildItem ".\dist\*.zip" -File -ErrorAction SilentlyContinue

          if (-not $zipFiles) {
            Write-Host "Contents of dist:"
            Get-ChildItem ".\dist" -Force
            throw "No ZIP files were produced."
          }

          foreach ($zip in $zipFiles) {
            Write-Host "Found: $($zip.Name)"
          }

      # ==========================================
      # GENERATE CHECKSUMS
      # ==========================================
      - name: Generate checksums
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Generating SHA256 checksums"
          Write-Host "=========================================="

          if (-not (Test-Path ".\dist")) {
            New-Item -ItemType Directory -Force -Path ".\dist" | Out-Null
          }

          $zipFiles = Get-ChildItem ".\dist\*.zip" -File

          if (-not $zipFiles) {
            throw "No ZIP files found in .\dist"
          }

          $checksums = foreach ($zip in $zipFiles) {
            $hash = Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256

            "$($hash.Hash)  $($zip.Name)"
          }

          $checksums |
            Out-File ".\dist\SHA256SUMS.txt" -Encoding utf8

          Write-Host ""
          Write-Host "SHA256SUMS.txt created:"
          Get-Content ".\dist\SHA256SUMS.txt"

      # ==========================================
      # SHOW FINAL FILES
      # ==========================================
      - name: Show final files
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Final distribution files"
          Write-Host "=========================================="

          Get-ChildItem ".\dist" -Force |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkipperBNS HATS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
