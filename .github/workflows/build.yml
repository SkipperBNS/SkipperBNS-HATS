   - name: Build HATS pack
     shell: pwsh
     run: |
      $ErrorActionPreference = "Stop"

      Write-Host "=========================================="
      Write-Host " SkipperBNS HATS Pack Builder"
      Write-Host "=========================================="

      $version = "${{ github.ref_name }}"

      if ($version.StartsWith("v")) {
        $version = $version.Substring(1)
      }

      if ([string]::IsNullOrWhiteSpace($version)) {
        $version = "main"
      }

      Write-Host "Version: $version"
      Write-Host ""

      if (-not (Test-Path -LiteralPath ".\scripts\build.ps1")) {
        throw "scripts\build.ps1 was not found."
      }

      if (-not (Test-Path -LiteralPath ".\components.json")) {
        throw "components.json was not found."
      }

      if (Test-Path -LiteralPath ".\dist") {
        Remove-Item -LiteralPath ".\dist" -Recurse -Force
      }

      New-Item -ItemType Directory -Path ".\dist" -Force | Out-Null

      Write-Host "Running build.ps1..."
      Write-Host ""

      try {
        & ".\scripts\build.ps1" -Version $version

        Write-Host ""
        Write-Host "build.ps1 finished."
      }
      catch {
        Write-Host ""
        Write-Host "build.ps1 reported an error:"
        Write-Host $_.Exception.Message

        Write-Host ""
        Write-Host "Checking whether a valid ZIP was nevertheless produced..."

        $existingZips = @(
          Get-ChildItem -Path "." -Filter "*.zip" -File -Recurse |
          Where-Object {
            $_.FullName -notlike "*\dist\*" -and
            $_.Length -gt 0
          }
        )

        if ($existingZips.Count -eq 0) {
          throw "build.ps1 failed and no valid ZIP was produced."
        }

        Write-Host "A valid ZIP was found, so continuing."
      }

      Write-Host ""
      Write-Host "Searching for build output..."

      $zipFiles = @(
        Get-ChildItem -Path "." -Filter "*.zip" -File -Recurse |
        Where-Object {
          $_.FullName -notlike "*\dist\*" -and
          $_.Length -gt 0
        }
      )

      if ($zipFiles.Count -eq 0) {
        throw "No valid ZIP was produced by build.ps1."
      }

      $zip = $zipFiles |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1

      Write-Host ""
      Write-Host "=========================================="
      Write-Host " BUILD ARTIFACT FOUND"
      Write-Host "=========================================="
      Write-Host "File: $($zip.FullName)"
      Write-Host "Size: $($zip.Length) bytes"

      $destination = Join-Path ".\dist" $zip.Name

      Copy-Item -LiteralPath $zip.FullName -Destination $destination -Force

      if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
        throw "Could not copy build ZIP to dist."
      }

      $distFile = Get-Item -LiteralPath $destination

      if ($distFile.Length -le 0) {
        throw "The copied ZIP is empty."
      }

      Write-Host ""
      Write-Host "Copied to:"
      Write-Host $destination

      Write-Host ""
      Write-Host "=========================================="
      Write-Host " BUILD OUTPUT VERIFIED"
      Write-Host "=========================================="

      Get-ChildItem -LiteralPath ".\dist" -File |
        Select-Object Name, Length |
        Format-Table -AutoSize
