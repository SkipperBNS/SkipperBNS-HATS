name: Build SkipperBNS HATS Pack

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hats-release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build SkipperBNS HATS
    runs-on: windows-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # VERIFY LOCAL APPLICATIONS
      # ==========================================

      - name: Verify local applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Checking local applications"
          Write-Host "=========================================="

          $files = @(
            ".\ftpd.nro",
            ".\checkpoint.nro"
          )

          foreach ($path in $files) {

            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required local file was not found: $path"
            }

            $file = Get-Item -LiteralPath $path

            if ($file.Length -le 0) {
              throw "Local file is empty: $path"
            }

            Write-Host "Found: $path"
            Write-Host "Size: $($file.Length) bytes"
          }

          Write-Host ""
          Write-Host "Local applications verified successfully."

      # ==========================================
      # BUILD HATS PACK
      # ==========================================

      - name: Build HATS pack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="
          Write-Host ""

          if (-not (Test-Path -LiteralPath ".\scripts\build.ps1")) {
            throw "scripts/build.ps1 was not found."
          }

          if (-not (Test-Path -LiteralPath ".\components.json")) {
            throw "components.json was not found."
          }

          Write-Host "Build version: main"
          Write-Host ""
          Write-Host "Running build.ps1..."
          Write-Host ""

          try {
            & ".\scripts\build.ps1" -Version "main"
          }
          catch {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host " BUILD FAILED"
            Write-Host "=========================================="
            Write-Host ""
            Write-Host $_.Exception.Message
            throw
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " build.ps1 completed successfully"
          Write-Host "=========================================="

          # ------------------------------------------
          # FIND GENERATED ZIP
          # ------------------------------------------

          $zipFiles = @(
            Get-ChildItem `
              -Path "." `
              -Filter "*.zip" `
              -File `
              -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*" -and
              $_.FullName -notlike "*\work\*" -and
              $_.Length -gt 0
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "build.ps1 completed but did not produce a HATS ZIP."
          }

          Write-Host ""
          Write-Host "HATS ZIP produced:"

          foreach ($zip in $zipFiles) {
            Write-Host "  $($zip.FullName)"
            Write-Host "  $($zip.Length) bytes"
          }

          Write-Host ""
          Write-Host "Build verification successful."

      # ==========================================
      # PREPARE RELEASE FILES
      # ==========================================

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Preparing release files"
          Write-Host "=========================================="

          if (Test-Path -LiteralPath ".\dist") {
            Remove-Item `
              -LiteralPath ".\dist" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path ".\dist" `
            -Force | Out-Null

          $zipFiles = @(
            Get-ChildItem `
              -Path "." `
              -Filter "*.zip" `
              -File `
              -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*" -and
              $_.FullName -notlike "*\work\*" -and
              $_.Length -gt 0
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "No HATS ZIP was produced by build.ps1."
          }

          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "Selected HATS ZIP:"
          Write-Host $zip.FullName
          Write-Host "Size: $($zip.Length) bytes"
          Write-Host ""

          $destination = ".\dist\SkipperBNS-HATS-main.zip"

          Copy-Item `
            -LiteralPath $zip.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path -LiteralPath $destination)) {
            throw "Failed to copy HATS ZIP into dist."
          }

          $copied = Get-Item -LiteralPath $destination

          if ($copied.Length -le 0) {
            throw "Copied HATS ZIP is empty."
          }

          Write-Host "Release ZIP:"
          Write-Host $copied.FullName
          Write-Host "Size: $($copied.Length) bytes"

      # ==========================================
      # SHA256
      # ==========================================

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Generating SHA256 checksum"
          Write-Host "=========================================="

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "SkipperBNS-HATS-main.zip was not found."
          }

          $zip = Get-Item -LiteralPath $zipPath

          $hash = (
            Get-FileHash `
              -LiteralPath $zip.FullName `
              -Algorithm SHA256
          ).Hash

          "$hash  $($zip.Name)" |
            Out-File `
              -FilePath ".\dist\SHA256SUMS.txt" `
              -Encoding utf8

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash
          Write-Host ""

          Write-Host "SHA256SUMS.txt:"
          Get-Content ".\dist\SHA256SUMS.txt"

      # ==========================================
      # VERIFY RELEASE
      # ==========================================

      - name: Verify release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Verifying release"
          Write-Host "=========================================="

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"
          $shaPath = ".\dist\SHA256SUMS.txt"

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "HATS ZIP was not found."
          }

          if (-not (Test-Path -LiteralPath $shaPath)) {
            throw "SHA256SUMS.txt was not found."
          }

          $zip = Get-Item -LiteralPath $zipPath
          $sha = Get-Item -LiteralPath $shaPath

          if ($zip.Length -le 0) {
            throw "HATS ZIP is empty."
          }

          if ($sha.Length -le 0) {
            throw "SHA256SUMS.txt is empty."
          }

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host "  $($zip.Name)"
          Write-Host "  $($zip.Length) bytes"

          Write-Host ""
          Write-Host "SHA256:"
          Get-Content -LiteralPath $shaPath

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BUILD VERIFIED SUCCESSFULLY"
          Write-Host "=========================================="

      # ==========================================
      # UPLOAD ACTION ARTIFACT
      # ==========================================

      - name: Upload HATS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SkipperBNS-HATS-main
          path: |
            dist/SkipperBNS-HATS-main.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # ==========================================
      # CREATE / UPDATE MAIN RELEASE
      # ==========================================

      - name: Publish HATS Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "main"

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"
          $shaPath = ".\dist\SHA256SUMS.txt"

          Write-Host "=========================================="
          Write-Host " Publishing SkipperBNS HATS Release"
          Write-Host "=========================================="
          Write-Host ""

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Release ZIP was not found."
          }

          if (-not (Test-Path -LiteralPath $shaPath)) {
            throw "SHA256SUMS.txt was not found."
          }

          Write-Host "Release tag: $tag"
          Write-Host "ZIP: $zipPath"
          Write-Host "SHA256: $shaPath"
          Write-Host ""

          # ------------------------------------------
          # CHECK EXISTING RELEASE
          # ------------------------------------------

          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Release '$tag' already exists."
            Write-Host "Replacing existing assets..."
            Write-Host ""

            gh release upload `
              $tag `
              $zipPath `
              $shaPath `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace release assets."
            }

            Write-Host ""
            Write-Host "Release assets replaced successfully."

          }
          else {

            Write-Host "Release '$tag' does not exist."
            Write-Host "Creating release..."
            Write-Host ""

            gh release create `
              $tag `
              $zipPath `
              $shaPath `
              --title "SkipperBNS HATS" `
              --notes "Automatically updated SkipperBNS HATS pack."

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release."
            }

            Write-Host ""
            Write-Host "Release created successfully."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RELEASE PUBLISHED SUCCESSFULLY"
          Write-Host "=========================================="
          Write-Host ""

          gh release view $tag
