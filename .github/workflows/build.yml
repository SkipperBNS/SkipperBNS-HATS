name: Build HATS Pack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HATS pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "main"
          }

          Write-Host "Version: $version"
          Write-Host ""

          # Clean/create dist
          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Path ".\dist" -Force | Out-Null

          Write-Host "Running build.ps1..."
          Write-Host ""

          # Run builder without immediately killing the workflow.
          & ".\scripts\build.ps1" -Version $version

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "build.ps1 exit code: $exitCode"

          # Find any ZIP produced by build.ps1.
          $zipFiles = @(
            Get-ChildItem -Path "." -Filter "*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*"
            }
          )

          if ($zipFiles.Count -eq 0) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host " ERROR: No ZIP was produced"
            Write-Host "=========================================="
            exit 1
          }

          # Use the newest ZIP.
          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "Found build output:"
          Write-Host $zip.FullName

          # Move/copy the generated ZIP into dist.
          $destination = Join-Path ".\dist" $zip.Name

          Copy-Item $zip.FullName $destination -Force

          Write-Host ""
          Write-Host "Copied to:"
          Write-Host $destination

          # The ZIP exists, so the actual build output succeeded.
          # Do not fail merely because build.ps1 returned a non-zero
          # status after producing the ZIP.
          if (-not (Test-Path $destination)) {
            Write-Host "ERROR: Could not create dist ZIP."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BUILD OUTPUT VERIFIED"
          Write-Host "=========================================="

          Get-ChildItem ".\dist" -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\dist")) {
            throw "dist folder does not exist"
          }

          $zipFiles = @(Get-ChildItem ".\dist\*.zip" -File)

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP files found in dist"
          }

          $lines = foreach ($file in $zipFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }

          $lines | Out-File `
            ".\dist\SHA256SUMS.txt" `
            -Encoding utf8

          Write-Host ""
          Write-Host "SHA256 checksums:"
          Get-Content ".\dist\SHA256SUMS.txt"

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Build output"
          Write-Host "=========================================="

          if (-not (Test-Path ".\dist")) {
            throw "dist folder was not created"
          }

          $zipFiles = @(Get-ChildItem ".\dist\*.zip" -File)

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP file exists in dist"
          }

          foreach ($file in $zipFiles) {
            Write-Host "ZIP: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"
          }

          if (-not (Test-Path ".\dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt was not created"
          }

          Write-Host ""
          Write-Host "SHA256SUMS.txt found."
          Write-Host ""
          Write-Host "BUILD VERIFIED SUCCESSFULLY."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkipperBNS HATS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
