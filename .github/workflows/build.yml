name: Build SkipperBNS HATS Pack

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: hats-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SkipperBNS HATS
    runs-on: windows-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================================================
      # VERIFY LOCAL APPLICATIONS
      # ==================================================

      - name: Verify local applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Checking local applications"
          Write-Host "=========================================="
          Write-Host ""

          $files = @(
            ".\ftpd.nro",
            ".\checkpoint.nro"
          )

          foreach ($path in $files) {

            if (-not (Test-Path $path)) {
              throw "Required local file was not found: $path"
            }

            $file = Get-Item $path

            if ($file.Length -le 0) {
              throw "Local file is empty: $path"
            }

            Write-Host "Found: $path"
            Write-Host "Size: $($file.Length) bytes"
            Write-Host ""
          }

          Write-Host "Local applications verified successfully."

      # ==================================================
      # BUILD HATS
      # ==================================================

      - name: Build HATS pack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="
          Write-Host ""

          if (-not (Test-Path ".\scripts\build.ps1")) {
            throw "scripts/build.ps1 was not found."
          }

          if (-not (Test-Path ".\components.json")) {
            throw "components.json was not found."
          }

          Write-Host "GitHub token configured:"
          Write-Host (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN))
          Write-Host ""

          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"

            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }
          else {
            $version = "main"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "main"
          }

          Write-Host "Build version: $version"
          Write-Host ""

          Write-Host "Running build.ps1..."
          Write-Host ""

          try {
            & ".\scripts\build.ps1" -Version $version

            if (-not $?) {
              throw "build.ps1 reported a failure."
            }
          }
          catch {
            throw "build.ps1 failed: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " build.ps1 completed successfully"
          Write-Host "=========================================="

      # ==================================================
      # PREPARE DIST
      # ==================================================

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Preparing release files"
          Write-Host "=========================================="
          Write-Host ""

          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path ".\dist" `
            -Force | Out-Null

          $zipFiles = @(
            Get-ChildItem "." -Filter "*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*" -and
              $_.FullName -notlike "*\work\*" -and
              $_.Length -gt 0
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "No HATS ZIP was produced by build.ps1."
          }

          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host "HATS ZIP found:"
          Write-Host $zip.FullName
          Write-Host "Size: $($zip.Length) bytes"
          Write-Host ""

          if ($zip.Length -le 0) {
            throw "HATS ZIP is empty."
          }

          $destination = Join-Path ".\dist" "SkipperBNS-HATS-main.zip"

          Copy-Item `
            -LiteralPath $zip.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Failed to copy HATS ZIP into dist."
          }

          $copied = Get-Item $destination

          if ($copied.Length -le 0) {
            throw "Copied HATS ZIP is empty."
          }

          Write-Host "Release ZIP:"
          Write-Host $copied.FullName
          Write-Host "Size: $($copied.Length) bytes"

      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Generating SHA256 checksum"
          Write-Host "=========================================="
          Write-Host ""

          $zip = Get-Item ".\dist\SkipperBNS-HATS-main.zip"

          if (-not $zip) {
            throw "SkipperBNS-HATS-main.zip was not found."
          }

          $hash = (
            Get-FileHash `
              $zip.FullName `
              -Algorithm SHA256
          ).Hash

          "$hash  $($zip.Name)" |
            Out-File `
              ".\dist\SHA256SUMS.txt" `
              -Encoding utf8

          Write-Host "SHA256:"
          Write-Host $hash
          Write-Host ""

          Write-Host "SHA256SUMS.txt:"
          Get-Content ".\dist\SHA256SUMS.txt"

      # ==================================================
      # VERIFY
      # ==================================================

      - name: Verify release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Verifying release"
          Write-Host "=========================================="
          Write-Host ""

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"
          $shaPath = ".\dist\SHA256SUMS.txt"

          if (-not (Test-Path $zipPath)) {
            throw "HATS ZIP was not found."
          }

          if (-not (Test-Path $shaPath)) {
            throw "SHA256SUMS.txt was not found."
          }

          $zip = Get-Item $zipPath
          $sha = Get-Item $shaPath

          if ($zip.Length -le 0) {
            throw "HATS ZIP is empty."
          }

          if ($sha.Length -le 0) {
            throw "SHA256SUMS.txt is empty."
          }

          Write-Host "ZIP:"
          Write-Host "  $($zip.Name)"
          Write-Host "  $($zip.Length) bytes"
          Write-Host ""

          Write-Host "SHA256:"
          Get-Content $shaPath
          Write-Host ""

          Write-Host "=========================================="
          Write-Host " BUILD VERIFIED SUCCESSFULLY"
          Write-Host "=========================================="

      # ==================================================
      # UPLOAD WORKFLOW ARTIFACT
      # ==================================================

      - name: Upload HATS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SkipperBNS-HATS-${{ github.ref_name }}
          path: |
            dist/SkipperBNS-HATS-main.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # ==================================================
      # PUBLISH GITHUB RELEASE
      # ==================================================

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"

          Write-Host "=========================================="
          Write-Host " Publishing SkipperBNS HATS Release"
          Write-Host "=========================================="
          Write-Host ""

          $zip = Get-Item ".\dist\SkipperBNS-HATS-main.zip"
          $checksum = Get-Item ".\dist\SHA256SUMS.txt"

          if (-not $zip) {
            throw "Release ZIP was not found."
          }

          if (-not $checksum) {
            throw "SHA256SUMS.txt was not found."
          }

          Write-Host "Tag:"
          Write-Host $tag
          Write-Host ""

          Write-Host "ZIP:"
          Write-Host $zip.FullName
          Write-Host ""

          Write-Host "SHA256:"
          Write-Host $checksum.FullName
          Write-Host ""

          Write-Host "Checking existing release..."

          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Release already exists."
            Write-Host "Uploading/replacing assets..."

            gh release upload `
              $tag `
              $zip.FullName `
              $checksum.FullName `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets."
            }

          }
          else {

            Write-Host "Release does not exist."
            Write-Host "Creating release..."

            gh release create `
              $tag `
              $zip.FullName `
              $checksum.FullName `
              --title "SkipperBNS HATS $tag" `
              --generate-notes

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release."
            }
          }

          Write-Host ""
          Write-Host "Release assets:"
          gh release view $tag

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RELEASE PUBLISHED SUCCESSFULLY"
          Write-Host "=========================================="
