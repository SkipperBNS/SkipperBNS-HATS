```yaml
name: Build SkipperBNS HATS Pack

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hats-release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build SkipperBNS HATS
    runs-on: windows-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # VERIFY LOCAL APPLICATIONS
      # ==========================================

      - name: Verify local applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Checking local applications"
          Write-Host "=========================================="

          $files = @(
            ".\ftpd.nro",
            ".\checkpoint.nro"
          )

          foreach ($path in $files) {
            if (-not (Test-Path $path)) {
              throw "Required local file was not found: $path"
            }

            $file = Get-Item $path

            if ($file.Length -le 0) {
              throw "Local file is empty: $path"
            }

            Write-Host "Found: $path"
            Write-Host "Size: $($file.Length) bytes"
          }

      # ==========================================
      # BUILD HATS
      # ==========================================

      - name: Build HATS pack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SkipperBNS HATS Pack Builder"
          Write-Host "=========================================="

          if (-not (Test-Path ".\scripts\build.ps1")) {
            throw "scripts/build.ps1 was not found."
          }

          if (-not (Test-Path ".\components.json")) {
            throw "components.json was not found."
          }

          Write-Host "Build version: main"
          Write-Host ""

          & ".\scripts\build.ps1" -Version "main"

          if ($LASTEXITCODE -ne 0) {
            throw "build.ps1 failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Build completed successfully."

      # ==========================================
      # PREPARE RELEASE ZIP
      # ==========================================

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " Preparing release files"
          Write-Host "=========================================="

          if (Test-Path ".\dist") {
            Remove-Item ".\dist" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path ".\dist" `
            -Force | Out-Null

          $zipFiles = @(
            Get-ChildItem "." -Filter "*.zip" -File -Recurse |
            Where-Object {
              $_.FullName -notlike "*\dist\*" -and
              $_.FullName -notlike "*\work\*" -and
              $_.Length -gt 0
            }
          )

          if ($zipFiles.Count -eq 0) {
            throw "No HATS ZIP was produced."
          }

          $zip = $zipFiles |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          Write-Host "Found:"
          Write-Host $zip.FullName
          Write-Host "Size: $($zip.Length) bytes"

          $destination = ".\dist\SkipperBNS-HATS-main.zip"

          Copy-Item `
            -LiteralPath $zip.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Failed to create release ZIP."
          }

          Write-Host ""
          Write-Host "Release ZIP created:"
          Write-Host $destination

      # ==========================================
      # SHA256
      # ==========================================

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"

          if (-not (Test-Path $zipPath)) {
            throw "Release ZIP was not found."
          }

          $hash = (
            Get-FileHash `
              $zipPath `
              -Algorithm SHA256
          ).Hash

          "$hash  SkipperBNS-HATS-main.zip" |
            Out-File `
              ".\dist\SHA256SUMS.txt" `
              -Encoding utf8

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $hash

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"
          $shaPath = ".\dist\SHA256SUMS.txt"

          if (-not (Test-Path $zipPath)) {
            throw "HATS ZIP was not found."
          }

          if (-not (Test-Path $shaPath)) {
            throw "SHA256SUMS.txt was not found."
          }

          $zip = Get-Item $zipPath
          $sha = Get-Item $shaPath

          if ($zip.Length -le 0) {
            throw "HATS ZIP is empty."
          }

          if ($sha.Length -le 0) {
            throw "SHA256SUMS.txt is empty."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RELEASE FILES VERIFIED"
          Write-Host "=========================================="

          Write-Host "ZIP: $($zip.Name)"
          Write-Host "Size: $($zip.Length) bytes"

          Write-Host ""
          Get-Content $shaPath

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload HATS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SkipperBNS-HATS-main
          path: |
            dist/SkipperBNS-HATS-main.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # ==========================================
      # CREATE / REPLACE MAIN RELEASE
      # ==========================================

      - name: Publish HATS Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "main"

          $zipPath = ".\dist\SkipperBNS-HATS-main.zip"
          $shaPath = ".\dist\SHA256SUMS.txt"

          Write-Host "=========================================="
          Write-Host " Publishing SkipperBNS HATS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Release tag: $tag"
          Write-Host "ZIP: $zipPath"
          Write-Host "SHA256: $shaPath"
          Write-Host ""

          # Check whether the release already exists.
          gh release view $tag 2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Release '$tag' already exists."
            Write-Host "Replacing existing assets..."

            gh release upload `
              $tag `
              $zipPath `
              $shaPath `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace release assets."
            }

            Write-Host ""
            Write-Host "Existing release updated successfully."

          }
          else {

            Write-Host "Release '$tag' does not exist."
            Write-Host "Creating release..."

            gh release create `
              $tag `
              $zipPath `
              $shaPath `
              --title "SkipperBNS HATS" `
              --notes "Automatically updated SkipperBNS HATS pack."

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release."
            }

            Write-Host ""
            Write-Host "Release created successfully."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RELEASE UPDATED SUCCESSFULLY"
          Write-Host "=========================================="

          gh release view $tag
```
